<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>JavaScript 練習</title>    
</head>
<body>
<h1>console.log & typeof</h1>
<script>
    x = 'hello';
    y = 123;
    console.log('x', x);
    console.log('x_typeof', typeof(x));
    console.log('y', y);
    console.log('y_typeof', typeof(y));
</script>

</body>
</html>
